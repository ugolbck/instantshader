# DORMANT until first manual publish:
#   (1) npm publish both packages once by hand,
#   (2) configure npm Trusted Publisher (owner/repo/release.yml) on npmjs.com
#       for each,
#   (3) ensure npm CLI >= 11.5.1 in this workflow.
# Until then this workflow only opens Version Packages PRs, publish step
# fails harmlessly without npm auth.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
