# DORMANT until first manual publish. To activate:
#   (1) npm publish both packages once by hand,
#   (2) configure npm Trusted Publisher (owner/repo/release.yml) on npmjs.com
#       for each,
#   (3) ensure npm CLI >= 11.5.1 in this workflow,
#   (4) set repository variable RELEASE_ENABLED=true
#       (GitHub repo Settings > Secrets and variables > Actions > Variables).
# Until then the job is skipped entirely.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
