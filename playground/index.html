<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>instantshader-playground</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: ui-monospace, monospace;
        overflow: hidden;
      }

      /* The shader owns the whole viewport; the overlay floats above it. */
      .stage {
        position: fixed;
        inset: 0;
      }
      .stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 232px;
        max-height: calc(100% - 2rem);
        overflow-y: auto;
        z-index: 1;
        padding: 0.5rem;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(10, 10, 10, 0.86);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: 0.625rem;
        color: #a3a3a3;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .hud::-webkit-scrollbar {
        width: 6px;
      }
      .hud::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }

      .shaders {
        display: flex;
        gap: 0.25rem;
      }
      .shaders button {
        flex: 1;
      }
      .shaders button.active {
        border-color: #e5e5e5;
        background: #e5e5e5;
        color: #0a0a0a;
      }

      .section {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 0.35rem;
      }
      /* No justify-content here: the badge alone pushes right via its own
         margin-left:auto. With space-between, a section that has no badge
         would send its title to the far right instead. */
      .section summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        color: #e5e5e5;
        padding: 0.15rem 0;
        user-select: none;
      }
      .section summary::-webkit-details-marker {
        display: none;
      }
      /* Disclosure arrow drawn by hand so it can sit tight against the label
         without the browser's default marker spacing. */
      .section summary::before {
        content: "▸";
        color: #525252;
        font-size: 0.5rem;
        margin-right: 0.3rem;
      }
      .section[open] summary::before {
        content: "▾";
      }
      .section summary em {
        margin-left: auto;
        font-style: normal;
        color: #737373;
      }
      .section-body {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.35rem 0 0.15rem;
      }

      button,
      select,
      input[type="text"] {
        background: rgba(255, 255, 255, 0.06);
        color: #e5e5e5;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 5px;
        padding: 0.2rem 0.35rem;
        font: inherit;
        min-width: 0;
      }
      button {
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: rgba(255, 255, 255, 0.35);
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      select {
        cursor: pointer;
      }
      input[type="range"] {
        cursor: pointer;
        accent-color: #e5e5e5;
        width: 100%;
        height: 12px;
      }
      input[type="checkbox"] {
        cursor: pointer;
        accent-color: #e5e5e5;
      }

      .row {
        display: flex;
        gap: 0.25rem;
      }
      .row > * {
        flex: 1;
      }

      .slider span {
        display: flex;
        justify-content: space-between;
        gap: 0.4rem;
      }
      .slider em {
        font-style: normal;
        color: #e5e5e5;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
      }

      .swatches {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .swatch {
        display: grid;
        grid-template-columns: 1.4rem 1fr 1.1rem;
        align-items: center;
        gap: 0.3rem;
      }
      /* Native colour inputs carry a chunky default border and padding that
         makes a stacked list look ragged; strip it back to a flat chip. */
      .swatch input[type="color"] {
        cursor: pointer;
        width: 1.4rem;
        height: 1.2rem;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 4px;
        background: transparent;
      }
      .swatch input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }
      .swatch input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 2px;
      }
      .swatch .hex {
        text-transform: lowercase;
      }
      .swatch .icon {
        border: none;
        background: transparent;
        color: #737373;
        padding: 0;
        line-height: 1;
        font-size: 0.8rem;
      }
      .swatch .icon:hover:not(:disabled) {
        color: #fca5a5;
        border-color: transparent;
      }

      .paste::placeholder {
        color: #525252;
      }
      .paste.invalid {
        border-color: #7f1d1d;
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
